name: TenOneTen
description: >-
  TenOneTen Ventures is an early-stage venture capital firm based in Los Angeles,
  founded in 2011 by repeat software founders David Waxman and Gil Elbaz (later
  joined by managing partner Minnie Ingersoll). The firm backs engineers-turned-
  entrepreneurs building B2B software, data infrastructure, artificial intelligence,
  and technical products that reimagine essential industries such as healthcare,
  logistics, real estate, and manufacturing. TenOneTen typically leads pre-seed,
  seed, and Series A rounds with checks from roughly $500K to $5M, invests about
  ten times a year with a ~90% B2B focus, and has backed companies including
  Procore, Pluto TV, Scopely, and Crexi. The firm also produces the LA Venture
  podcast covering the Los Angeles startup and investor community. This profile is
  maintained in the API Evangelist network as a venture-capital company record.
